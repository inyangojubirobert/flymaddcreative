<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One Dream Initiative</title>
    <meta name="robots" content="noindex">
    <script>
        // Paid voting has ended (19 October 2026). Old vote links still work:
        // they open the creator's profile or shop in the One Dream web app,
        // where supporters can send a gift instead.
        (function () {
            var params = new URLSearchParams(window.location.search);
            var user = (params.get('user') || params.get('username') || '').trim();
            var target = '/app/leaderboard';
            if (user) {
                var name = encodeURIComponent(user);
                target = window.location.hash === '#catalogue' ? '/app/catalogue/' + name : '/app/profile/' + name;
            } else if (params.get('code')) {
                target = '/app/search';
            }
            window.location.replace(target);
        })();
    </script>
    <style>
        body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #e2e8f0; margin: 0; padding: 48px 16px; text-align: center; }
        a { color: #fbbf24; }
    </style>
</head>
<body>
    <h1>Paid voting has ended</h1>
    <p>Support creators and sellers with Dream Coin gifts in the One Dream app.</p>
    <p><a href="/app/leaderboard">Open the One Dream app</a></p>
</body>
</html>
